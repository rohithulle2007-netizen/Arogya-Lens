name: Deploy Arogya Lens Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Production Backend API URL (e.g. https://your-backend.up.railway.app)'
        required: false
        default: ''
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Production API Configuration
        run: |
          API_URL="${{ inputs.api_base_url || vars.VITE_API_BASE_URL || 'https://arogya-lens-y01v.onrender.com' }}"
          # Trim whitespace and trailing slashes
          API_URL=$(echo "$API_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s:/*$::')

          if [ -z "$API_URL" ]; then
            echo "::error file=.github/workflows/deploy-frontend.yml::DEPLOYMENT HALTED: 'VITE_API_BASE_URL' is required. Configure your Render backend URL in GitHub Repository Settings -> Secrets and variables -> Actions -> Variables -> VITE_API_BASE_URL (e.g. https://your-service.onrender.com) or pass api_base_url via workflow_dispatch."
            exit 1
          else
            if [[ ! "$API_URL" =~ ^https:// ]]; then
              echo "::error file=.github/workflows/deploy-frontend.yml::DEPLOYMENT HALTED: 'VITE_API_BASE_URL' must start with 'https://' (HTTPS required for GitHub Pages). Provided: '$API_URL'"
              exit 1
            fi

            if [[ "$API_URL" =~ (localhost|127\.0\.0\.1) ]]; then
              echo "::error file=.github/workflows/deploy-frontend.yml::DEPLOYMENT HALTED: 'VITE_API_BASE_URL' cannot be localhost in production. Provided: '$API_URL'"
              exit 1
            fi

            echo "✅ Production API URL validated: $API_URL"
            echo "VALIDATED_API_BASE_URL=$API_URL" >> $GITHUB_ENV
          fi

      - name: Build Frontend Application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.VALIDATED_API_BASE_URL }}
          VITE_BASE_PATH: './'
        run: |
          echo "Building Arogya Lens frontend connected to backend: $VITE_API_BASE_URL"
          npm run build

      - name: Security and Isolation Audit
        run: |
          echo "Auditing frontend build distribution artifacts..."
          test -f frontend/dist/index.html || (echo "ERROR: Missing dist/index.html" && exit 1)
          test -f frontend/dist/404.html || (echo "ERROR: Missing dist/404.html" && exit 1)
          test -d frontend/dist/js || (echo "ERROR: Missing dist/js directory" && exit 1)
          test -f frontend/dist/.nojekyll || (echo "ERROR: Missing dist/.nojekyll" && exit 1)

          # Verify no backend, ml, uploads, databases, or .env files are in the artifact
          if [ -d "frontend/dist/backend" ] || [ -d "frontend/dist/ml" ] || [ -d "frontend/dist/uploads" ] || [ -f "frontend/dist/arogya_lens.db" ] || [ -f "frontend/dist/.env" ]; then
            echo "SECURITY VIOLATION: Sensitive backend or database files detected in frontend distribution bundle!"
            exit 1
          fi
          echo "Security audit passed: Artifact strictly contains isolated frontend distribution files."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # STRICT: Upload ONLY the generated frontend/dist directory, never root '.'
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
