name: Arogya Lens CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend & ML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (OpenCV / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest -v

      - name: Run ML Inference Pytest Suite
        run: |
          cd ml
          pytest -v

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f frontend/dist/index.html || (echo "Missing dist/index.html" && exit 1)
          test -d frontend/dist/js || (echo "Missing dist/js directory" && exit 1)
          test -f frontend/dist/js/config.js || (echo "Missing dist/js/config.js" && exit 1)
          test -f frontend/dist/.nojekyll || (echo "Missing dist/.nojekyll" && exit 1)
          echo "Frontend distribution bundle verified successfully."
