# ==============================================================================
# Arogya Lens — Render Infrastructure as Code Blueprint
# Deploys the FastAPI backend with OpenCV, ML ensemble models, and persistent storage
# ==============================================================================
services:
  - type: web
    name: arogya-lens-backend
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Arogya Lens API
      - key: APP_VERSION
        value: 1.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_OTP_ENABLED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://rohithulle2007-netizen.github.io
      - key: DATABASE_URL
        value: sqlite:///./arogya_lens.db
      - key: UPLOAD_DIR
        value: ./uploads
